server {
    listen 8585;
    listen [::]:8585;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security / performance headers
    add_header X-Content-Type-Options "nosniff" always;
    # Send the origin as Referer for cross-origin requests. OpenStreetMap's tile
    # usage policy requires a Referer to identify the app; "no-referrer" gets
    # the tiles blocked.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static app (SPA-ish: always fall back to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- N2YO API reverse proxy -------------------------------------------------
    # Same-origin proxy so the browser never hits CORS restrictions.
    # The user's own API key travels in the query string and is never stored
    # on the server.
    location /api/n2yo/ {
        proxy_pass https://api.n2yo.com/;
        proxy_http_version 1.1;
        proxy_set_header Host api.n2yo.com;
        proxy_set_header User-Agent "AMSAT-Tracker/1.0";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Re-resolve the upstream periodically
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

        # Never cache API responses
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 512;
}
